<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 模型作品集 | 今视广告线上展馆</title>
    <meta name="description" content="今视广告 3D 模型作品集：卡片式浏览，支持搜索、分类与排序，点击卡片即可进入对应的 3D 展示页，360° 查看细节。">
    <meta name="theme-color" content="#0b1a2b">
    <link rel="icon" href="images/favicon.ico?v=20260926">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png?v=20260926">
    <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png?v=20260926">

    <link rel="stylesheet" href="css/style.css?v=20260930">
    <link rel="stylesheet" href="css/share.css?v=20261013">

    <!-- defer：按顺序执行。three → GLTFLoader → modelsync(数据源) → zfight(消闪) → model-cards(本页卡片网格) -->
    <script src="js/serve-check.js?v=20260922" defer></script>
    <script src="js/three.min.js" defer></script>
    <script src="js/GLTFLoader.js?v=20260922" defer></script>
    <script src="js/modelsync.js?v=20260924" defer></script>
    <script src="js/zfight.js?v=20260923" defer></script>
    <!-- 作品设置快照（发布时保存的贴图方向等）：卡片预览也要按作者保存的方向显示 -->
    <script src="js/viewer-settings.js?v=20261013" defer></script>
    <script src="js/model-cards.js?v=20261013" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js" defer onerror="var s=document.createElement('script');s.src='https://unpkg.com/qrcodejs@1.0.0/qrcode.min.js';document.head.appendChild(s)"></script>
</head>
<body>
    <a class="skip-link" href="#gallery-section">跳到主要内容</a>

    <header class="site-header">
        <div class="container header-inner">
            <a class="logo" href="index.html" aria-label="今视广告 首页">
                <picture>
                    <source srcset="images/logo.webp" type="image/webp">
                    <img src="images/logo.png" alt="今视广告" width="620" height="150">
                </picture>
            </a>

            <div class="header-actions">
                <a class="btn btn-outline btn-sm is-secondary-action" href="index.html">返回首页</a>
            </div>
        </div>
    </header>

    <main>
        <section id="gallery-section" class="section">
            <div class="container">
                <div class="section-head">
                    <p class="section-head-note" id="cards-note">正在读取作品…</p>
                    <h1 class="section-title">3D 模型作品展示</h1>
                    <div class="section-head-actions">
                        <a class="btn btn-primary btn-sm" href="model-viewer.html">打开查看器</a>
                    </div>
                </div>

                <!-- 搜索 / 分类筛选 / 排序。有作品后由 js/model-cards.js 显示 -->
                <div class="cards-toolbar" id="cards-toolbar" hidden>
                    <div class="cards-search">
                        <svg class="cards-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="11" cy="11" r="7"/>
                            <path d="m20 20-3.6-3.6"/>
                        </svg>
                        <input id="cards-q" type="search" autocomplete="off" placeholder="搜索模型名称或分类…"
                               aria-label="搜索模型名称或分类">
                    </div>

                    <div class="cards-chips" id="cards-categories" role="group" aria-label="按分类筛选"></div>

                    <label class="cards-sort">
                        <span class="cards-sort-label">排序</span>
                        <select id="cards-sort" aria-label="排序方式">
                            <option value="new">最新发布</option>
                            <option value="old">最早发布</option>
                            <option value="name">名称排序</option>
                        </select>
                    </label>
                </div>

                <div class="cards-grid" id="cards-grid" hidden></div>

                <div class="gallery-empty" id="cards-empty" hidden>
                    <p class="gallery-empty-title" id="cards-empty-title">暂无已发布的模型作品</p>
                    <p class="gallery-empty-hint" id="cards-empty-hint">在管理后台上传模型并发布后，这里会显示卡片</p>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-brand">
                    <div class="footer-logo">今视广告线上展馆</div>
                    <p class="footer-tagline">Web3D 技术助力产品"走出去"</p>
                </div>
                <nav class="footer-links" aria-label="页脚导航">
                    <a href="index.html">首页</a>
                    <a href="index.html#services">服务</a>
                    <a href="index.html#cases">案例</a>
                    <a href="models.html">模型作品</a>
                    <a href="index.html#contact">联系我们</a>
                    <a href="admin.html">管理后台</a>
                </nav>
                <div class="footer-info">
                    <p>电话：<a href="tel:15025505147">150-2550-5147</a></p>
                    <p>邮箱：<a href="mailto:2021896820@qq.com">2021896820@qq.com</a></p>
                </div>
            </div>
            <div class="footer-copyright">
                <p>&copy; 2026 今视广告线上展馆. 保留所有权利。</p>
            </div>
        </div>
    </footer>

    <!-- ========== 3D 模型分享弹层 ========== -->
    <div class="share-overlay" id="modelShareOverlay">
      <div class="share-modal">
        <button class="close-share" onclick="ModelShare.close()">✕</button>
        <div class="share-local-only" id="modelShareLocalOnly" style="display:none"></div>
        <div class="share-work-card" id="modelShareWorkCard"></div>
        <p class="share-url-label" id="modelShareHint">扫码在手机上打开，或复制链接分享</p>
        <div class="share-url-box">
          <input type="text" id="modelShareUrl" readonly>
          <button onclick="ModelShare.copyUrl()">复制</button>
        </div>
        <div class="share-platforms">
          <button class="sp-btn wechat" onclick="ModelShare.toWechat()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="#07c160"><path d="M8.5 11.5a1 1 0 100-2 1 1 0 000 2zm7 0a1 1 0 100-2 1 1 0 000 2z"/><path d="M8.69 14.82a.5.5 0 11-.38-.92 6.5 6.5 0 017.38 0 .5.5 0 11-.38.92 5.5 5.5 0 00-6.62 0z"/><path d="M12 2C6.48 2 2 5.82 2 10.5c0 2.63 1.45 4.98 3.72 6.5L5 21l4.36-2.18C10.22 19.27 11.09 19.5 12 19.5c5.52 0 10-3.82 10-8.5S17.52 2 12 2z"/></svg>
            微信分享
          </button>
          <button class="sp-btn link" onclick="ModelShare.copyUrl()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
            复制链接
          </button>
          <button class="sp-btn moments" onclick="ModelShare.toMoments()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="#ff5722"><circle cx="12" cy="12" r="10"/><path fill="white" d="M12 6a2 2 0 100 4 2 2 0 000-4zm-3 8h6v2H9v-2z"/></svg>
            朋友圈
          </button>
        </div>
        <p>💡 点击微信/朋友圈按钮生成分享海报，长按保存后分享</p>
      </div>
    </div>

    <!-- ========== 分享海报预览 ========== -->
    <div class="share-overlay" id="modelPosterOverlay">
      <div class="poster-modal">
        <button class="close-share" onclick="ModelShare.closePoster()">✕</button>
        <h3 style="margin-bottom:16px">分享海报</h3>
        <div id="modelPosterPreview" style="max-height:65vh;overflow-y:auto"></div>
        <div class="poster-actions">
          <button class="sp-btn-download" onclick="ModelShare.downloadPoster()">📥 下载海报</button>
          <button class="sp-btn-close2" onclick="ModelShare.closePoster()">关闭</button>
        </div>
      </div>
    </div>

    <script src="js/model-share.js?v=20261013" defer></script>
</body>
</html>
