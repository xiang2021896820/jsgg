<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="全景展馆 - 720° 沉浸式全景作品在线浏览，支持多场景切换、热点跳转与手机陀螺仪">
  <title>全景展馆 · 今视广告线上展馆</title>
    <link rel="stylesheet" href="css/style.css?v=20261001">
  <!-- 提前建立连接：手机端进入作品时省去 DNS/TLS 握手，全景图更快出画面 -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://i.ibb.co" crossorigin>
  <link rel="dns-prefetch" href="https://i.ibb.co">
  <!-- defer：不阻塞页面解析（手机端 jsdelivr 慢时不会整页卡住），并带镜像回退 -->
  <script defer src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js" onerror="var s=document.createElement('script');s.src='https://unpkg.com/three@0.160.0/build/three.min.js';document.head.appendChild(s)"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js" onerror="var s=document.createElement('script');s.src='https://unpkg.com/qrcodejs@1.0.0/qrcode.min.js';document.head.appendChild(s)"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js" onerror="var s=document.createElement('script');s.src='https://unpkg.com/lz-string@1.5.0/libs/lz-string.min.js';document.head.appendChild(s)"></script>
</head>
<body>

<!-- ========== 黑名单拦截页 ========== -->
<div class="blocked-page" id="blockedPage" style="display:none">
  <div class="blocked-card">
    <div class="blocked-icon">🚫</div>
    <h2>该内容不对外开放</h2>
    <p>抱歉，您没有权限查看此内容</p>
  </div>
</div>

<!-- ========== 顶部导航条 ========== -->
<header class="site-topbar">
  <div class="topbar-inner">
    <a class="topbar-brand" href="../">
      <span class="topbar-mark">720°</span>
      <span class="topbar-name">全景展馆</span>
    </a>
    <div class="topbar-actions">
      <button class="topbar-btn" onclick="scrollToGallery()">作品广场</button>
      <a class="topbar-btn topbar-btn--primary" href="../">返回主站</a>
    </div>
  </div>
</header>

<!-- ========== 主页 ========== -->
<main id="pageHome" class="page page-active">
  <!-- Hero Banner -->
  <section class="hero">
    <div class="hero-bg" id="heroBg"></div>
    <div class="hero-content">
      <h1 class="hero-title">720° 沉浸式全景体验</h1>
      <p class="hero-sub">点击作品即可进入全景浏览，支持手机陀螺仪和微信分享</p>
      <div class="hero-btns">
        <button class="btn-primary btn-lg" onclick="scrollToGallery()">浏览作品</button>
      </div>
    </div>
  </section>

  <!-- 分类筛选 -->
  <section class="gallery-section" id="gallerySection">
    <div class="container">
      <div class="section-header">
        <h2>作品广场</h2>
        <div class="search-bar">
          <input type="text" id="searchInput" placeholder="搜索作品..." oninput="filterWorks()">
          <button class="search-btn">🔍</button>
        </div>
      </div>
      <div class="category-tabs" id="categoryTabs">
        <!-- 动态渲染 -->
      </div>

      <!-- 作品网格 -->
      <div class="works-grid" id="worksGrid"></div>

      <div class="load-more">
        <button class="btn-outline" id="loadMoreBtn" onclick="loadMoreWorks()">加载更多</button>
      </div>
    </div>
  </section>
</main>

<!-- ========== 全景查看器弹层 ========== -->
<div class="viewer-overlay" id="viewerOverlay">
  <div class="viewer-container">
    <div class="viewer-header">
      <div class="viewer-info">
        <span class="viewer-title" id="viewerTitle">全景作品</span>
        <span class="viewer-scene-title" id="viewerSceneTitle" style="display:none"></span>
        <span class="viewer-author" id="viewerAuthor"></span>
      </div>
      <div class="viewer-actions">
        <button class="vbtn vbtn-share" onclick="openViewerShare()" title="分享">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
        </button>
        <button class="vbtn vbtn-close" onclick="closeViewer()">✕</button>
      </div>
    </div>
    <canvas id="vrCanvas"></canvas>
    <div class="viewer-loading" id="viewerLoading">
      <div class="loading-spinner"></div>
      <p class="loading-title">正在加载全景…</p>
      <div class="loading-pct">0%</div>
      <div class="loading-bar"><div class="loading-bar-fill" style="width:0%"></div></div>
      <div class="loading-size"></div>
      <div class="loading-slow-tip">网络较慢，正在努力加载，请稍候…</div>
    </div>

    <!-- 常驻底部工具栏 -->
    <div class="viewer-toolbar" id="viewerToolbar">
      <button class="vtool-btn" id="btnAutoRotate" onclick="toggleAutoRotate()" title="自动旋转">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
        <span>自动</span>
      </button>
      <button class="vtool-btn" id="btnViewMode" onclick="toggleViewModeMenu()" title="视角模式">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/></svg>
        <span class="vm-label">视角</span>
      </button>
      <button class="vtool-btn" id="btnMusic" onclick="toggleMusic()" title="背景音乐">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        <span>音乐</span>
      </button>
      <button class="vtool-btn" id="btnComment" onclick="toggleCommentPanel()" title="评论">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
        <span>评论</span>
      </button>
      <button class="vtool-btn" onclick="takeScreenshot()" title="截图">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
        <span>截图</span>
      </button>
      <button class="vtool-btn gyro-btn" id="btnGyro" onclick="toggleGyro()" title="陀螺仪">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 010 20M12 2a15.3 15.3 0 000 20"/></svg>
        <span>陀螺仪</span>
      </button>
      <button class="vtool-btn" onclick="resetView()" title="重置视角">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
        <span>重置</span>
      </button>
      <button class="vtool-btn vr-btn" id="btnVR" onclick="toggleVR()" title="VR模式">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="10" rx="3"/><circle cx="7" cy="12" r="2"/><circle cx="17" cy="12" r="2"/></svg>
        <span>VR</span>
      </button>
      <button class="vtool-btn" onclick="toggleFullscreen()" title="全屏">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 00-2 2v3M21 8V5a2 2 0 00-2-2h-3M3 16v3a2 2 0 002 2h3M16 21h3a2 2 0 002-2v-3"/></svg>
        <span>全屏</span>
      </button>
    </div>

    <!-- 工具栏手柄：工具栏自动收起后，点击它可再次拉起 -->
    <button class="toolbar-handle" id="toolbarHandle" onclick="toggleViewerToolbar()" title="显示工具栏" aria-label="显示工具栏">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 15 12 9 18 15"/></svg>
      <span>工具</span>
    </button>

    <!-- 视角模式菜单 -->
    <div class="view-mode-menu" id="viewModeMenu">
      <button class="vm-opt" data-mode="normal" onclick="setViewMode('normal');toggleViewModeMenu()">正常视角</button>
      <button class="vm-opt" data-mode="fisheye" onclick="setViewMode('fisheye');toggleViewModeMenu()">鱼眼</button>
      <button class="vm-opt" data-mode="planet" onclick="setViewMode('planet');toggleViewModeMenu()">小行星</button>
      <button class="vm-opt" data-mode="ball" onclick="setViewMode('ball');toggleViewModeMenu()">水晶球</button>
    </div>

    <!-- 评论侧边面板 -->
    <div class="comment-panel" id="commentPanel">
      <div class="comment-panel-header">
        <span>💬 评论</span>
        <button class="comment-close" onclick="toggleCommentPanel()">✕</button>
      </div>
      <div class="comment-list" id="commentList"></div>
      <div class="comment-input-row">
        <input type="text" id="commentInput" placeholder="说点什么..." maxlength="200">
        <button class="comment-send" onclick="sendComment()">发送</button>
      </div>
    </div>

    <div class="scene-nav" id="sceneNav" style="display:none"></div>
  </div>
</div>

<!-- ========== 分享弹层 ========== -->
<div class="share-overlay" id="shareOverlay">
  <div class="share-modal">
    <button class="close-share" onclick="closeShare()">✕</button>
    <div class="share-work-card" id="shareWorkCard"></div>
    <p class="share-url-label">扫码在手机上打开，或复制链接分享</p>
    <div class="share-url-box">
      <input type="text" id="shareUrl" readonly>
      <button onclick="copyShareUrl()">复制</button>
    </div>
    <div class="share-platforms">
      <button class="sp-btn wechat" onclick="shareToWechat()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#07c160"><path d="M8.5 11.5a1 1 0 100-2 1 1 0 000 2zm7 0a1 1 0 100-2 1 1 0 000 2z"/><path d="M8.69 14.82a.5.5 0 11-.38-.92 6.5 6.5 0 017.38 0 .5.5 0 11-.38.92 5.5 5.5 0 00-6.62 0z"/><path d="M12 2C6.48 2 2 5.82 2 10.5c0 2.63 1.45 4.98 3.72 6.5L5 21l4.36-2.18C10.22 19.27 11.09 19.5 12 19.5c5.52 0 10-3.82 10-8.5S17.52 2 12 2z"/></svg>
        微信分享
      </button>
      <button class="sp-btn link" onclick="copyShareUrl()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
        复制链接
      </button>
      <button class="sp-btn moments" onclick="shareToMoments()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#ff5722"><circle cx="12" cy="12" r="10"/><path fill="white" d="M12 6a2 2 0 100 4 2 2 0 000-4zm-3 8h6v2H9v-2z"/></svg>
        朋友圈
      </button>
    </div>
    <p>
      💡 点击微信/朋友圈按钮生成分享海报，长按保存后分享
    </p>
  </div>
</div>

<!-- ========== 海报预览 ========== -->
<div class="share-overlay" id="posterOverlay">
  <div class="poster-modal">
    <button class="close-share" onclick="closePoster()">✕</button>
    <h3 style="margin-bottom:16px">分享海报</h3>
    <div id="posterPreview" style="max-height:65vh;overflow-y:auto"></div>
    <div style="display:flex;gap:12px;justify-content:center;margin-top:16px">
      <button class="btn-primary" onclick="downloadPoster()">📥 下载海报</button>
      <button class="btn-ghost" onclick="closePoster()">关闭</button>
    </div>
    <p style="font-size:0.75rem;color:var(--text-muted);margin-top:12px;text-align:center">
      长按海报图片保存到手机相册，然后发送给微信好友
    </p>
  </div>
</div>

<!-- ========== Toast ========== -->
<div class="toast" id="toast"></div>

<footer class="footer">
  <div class="container">
    <div class="footer-bottom">
      <p>© 2026 今视广告线上展馆 · 全景展馆</p>
    </div>
  </div>
</footer>

<script defer src="js/data.js?v=20260930"></script>
<script defer src="js/viewer.js?v=20260926"></script>
<script defer src="js/app.js?v=20260930"></script>
</body>
</html>
